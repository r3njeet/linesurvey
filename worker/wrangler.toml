name = "line-survey-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# R2 bucket that stores photographs and survey records.
# Create it once:  npx wrangler r2 bucket create line-survey
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "line-survey"

[vars]
# Set to your GitHub Pages origin, e.g. "https://<user>.github.io" (comma separate several). "*" allows any.
ALLOWED_ORIGINS = "*"

# Secrets (NOT stored here) — set with:
#   npx wrangler secret put SURVEY_KEY
#   npx wrangler secret put ADMIN_KEY
